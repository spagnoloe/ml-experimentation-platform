[project]
name = "adp-experimentation-platform"
version = "0.1.0"
description = "Train, compare and serve California house value models."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "mlflow>=3.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The inherited notebook is kept as-is: it is the evidence for the notebook issues.
extend-exclude = ["model_experiment.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
