# Seed config: submitted by `make seed`, one per algorithm. Fixed hyperparameters keep seed fast.
name: seed-gradient-boosting
algorithm: gradient_boosting
features:
  bedrooms_per_room: false
target_transform: log1p
tuning:
  mode: fixed
  params:
    n_estimators: 200
    learning_rate: 0.1
    max_depth: 3
random_state: 42
